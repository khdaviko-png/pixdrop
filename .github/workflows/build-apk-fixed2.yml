name: Build PixDrop Fixed2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - main.dart
      - pubspec.yaml
      - assets/**
      - tools/patch_app.py
      - .github/workflows/build-apk-fixed2.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          cp main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org uz.pixdrop --project-name pixdrop .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Apply requested fixes
        run: python3 tools/patch_app.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-fixed2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

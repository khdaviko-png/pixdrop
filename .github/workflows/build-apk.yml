name: Build PixDrop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/pixdrop_src
          cp lib/main.dart /tmp/pixdrop_src/main.dart
          cp pubspec.yaml /tmp/pixdrop_src/pubspec.yaml
          flutter create --platforms=android --org uz.pixdrop --project-name pixdrop .
          cp /tmp/pixdrop_src/main.dart lib/main.dart
          cp /tmp/pixdrop_src/pubspec.yaml pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

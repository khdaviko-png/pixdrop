name: Build PixDrop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'main.dart'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/pixdrop_src
          cp main.dart /tmp/pixdrop_src/main.dart
          cp pubspec.yaml /tmp/pixdrop_src/pubspec.yaml
          flutter create --platforms=android --org uz.pixdrop --project-name pixdrop .
          cp /tmp/pixdrop_src/main.dart lib/main.dart
          cp /tmp/pixdrop_src/pubspec.yaml pubspec.yaml

      - name: Fix source compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('minHeight: 118,', 'constraints: const BoxConstraints(minHeight: 118),')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

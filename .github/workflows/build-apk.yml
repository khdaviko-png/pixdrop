name: Build PixDrop APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'main.dart'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/pixdrop_src
          cp main.dart /tmp/pixdrop_src/main.dart
          cp pubspec.yaml /tmp/pixdrop_src/pubspec.yaml
          flutter create --platforms=android --org uz.pixdrop --project-name pixdrop .
          cp /tmp/pixdrop_src/main.dart lib/main.dart
          cp /tmp/pixdrop_src/pubspec.yaml pubspec.yaml

      - name: Fix source, validation, AI v2 UI and Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('minHeight: 118,', 'constraints: const BoxConstraints(minHeight: 118),')

          register_class = s.index('class _RegisterPageState extends State<RegisterPage>')
          method_start = s.index('  Future<void> _register() async {', register_class)
          method_end = s.index('\n\n  @override\n  Widget build', method_start)
          new_method = r'''  Future<void> _register() async {
            final name = _name.text.trim();
            final rawPhone = _phone.text.trim();
            final district = _district.text.trim();
            final password = _password.text;

            final digits = rawPhone.replaceAll(RegExp(r'\D'), '');
            String phone = rawPhone;
            if (digits.length == 9) {
              phone = '+998$digits';
            } else if (digits.length == 12 && digits.startsWith('998')) {
              phone = '+$digits';
            }

            if (phone != rawPhone) {
              _phone.text = phone;
              _phone.selection = TextSelection.collapsed(offset: phone.length);
            }

            final errors = <String>[];
            if (name.isEmpty) {
              errors.add(tr('Ism va familiyangizni kiriting.', 'Введите имя и фамилию.'));
            } else if (name.length < 2) {
              errors.add(tr('Ism juda qisqa.', 'Имя слишком короткое.'));
            }
            if (phone.isEmpty) {
              errors.add(tr('Telefon raqamini kiriting.', 'Введите номер телефона.'));
            } else if (!_validPhone(phone)) {
              errors.add(tr('Telefon raqami xato. Masalan: +998901234567', 'Неверный номер телефона. Пример: +998901234567'));
            }
            if (district.isEmpty) {
              errors.add(tr('Tuman yoki shaharni kiriting.', 'Введите район или город.'));
            } else if (district.length < 2) {
              errors.add(tr('Tuman / shahar nomi juda qisqa.', 'Название района / города слишком короткое.'));
            }
            if (password.isEmpty) {
              errors.add(tr('Parolni kiriting.', 'Введите пароль.'));
            } else if (password.length < 4) {
              errors.add(tr('Parol kamida 4 ta belgidan iborat bo‘lsin.', 'Пароль должен содержать минимум 4 символа.'));
            }

            if (errors.isNotEmpty) {
              ScaffoldMessenger.of(context).hideCurrentSnackBar();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  duration: const Duration(seconds: 8),
                  content: Text('${tr('Quyidagi xatolarni to‘g‘rilang:', 'Исправьте следующие ошибки:')}\n• ${errors.join('\n• ')}'),
                ),
              );
              return;
            }

            setState(() => _loading = true);
            final result = await AuthService.register(
              name: name,
              phone: phone,
              district: district,
              password: password,
            );
            if (!mounted) return;
            setState(() => _loading = false);

            ScaffoldMessenger.of(context).hideCurrentSnackBar();
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(
                duration: Duration(seconds: result.ok ? 4 : 8),
                content: Text(result.ok ? result.message : '${tr('Ro‘yxatdan o‘tilmadi:', 'Регистрация не выполнена:')} ${result.message}'),
              ),
            );
            if (result.ok) Navigator.pop(context);
          }'''
          s = s[:method_start] + new_method + s[method_end:]

          scan_class = s.index('class _ScanPageState extends State<ScanPage>')
          scan_start = s.index('  Future<void> _scanDirectly() async {', scan_class)
          scan_end = s.index('\n\n  @override\n  Widget build', scan_start)
          new_scan = r'''  Future<void> _scanDirectly() async {
            final p = await ImagePicker().pickImage(
              source: ImageSource.camera,
              imageQuality: 92,
            );

            if (p == null) {
              if (mounted && _img == null) Navigator.pop(context);
              return;
            }

            setState(() {
              _img = File(p.path);
              _loading = true;
              _res = null;
            });

            try {
              final req = http.MultipartRequest('POST', Uri.parse('$baseUrl/predict'));
              req.headers.addAll(await AuthService.authHeaders());
              req.fields['shop_id'] = userData['phone'] ?? '';
              req.files.add(await http.MultipartFile.fromPath('image', p.path));
              final streamed = await req.send().timeout(const Duration(seconds: 45));
              final body = await streamed.stream.bytesToString();

              Map<String, dynamic>? data;
              try {
                final decoded = json.decode(body);
                if (decoded is Map) data = Map<String, dynamic>.from(decoded);
              } catch (_) {}

              if (!mounted) return;

              if (streamed.statusCode == 200 && data != null) {
                if ((data['status'] ?? '').toString() == 'similar') {
                  final selected = await _chooseSimilar(data);
                  if (!mounted) return;
                  if (selected != null && selected['_rescan'] == true) {
                    setState(() => _loading = false);
                    await _scanDirectly();
                    return;
                  }
                  if (selected != null) {
                    final picked = Map<String, dynamic>.from(selected);
                    setState(() {
                      _res = {
                        'status': 'selected',
                        'name': picked['name'],
                        'price': picked['price'],
                        'code': picked['code'],
                        'score': picked['score'],
                        'match': picked,
                      };
                      _loading = false;
                    });
                    await rememberProductSearch(picked);
                    return;
                  }
                  setState(() => _loading = false);
                  return;
                }

                setState(() {
                  _res = data;
                  _loading = false;
                });
                await rememberProductSearch(Map<String, dynamic>.from(data));
                return;
              }

              final message = data?['message']?.toString() ?? tr('Mahsulot topilmadi.', 'Товар не найден.');
              setState(() => _loading = false);
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(message)));
            } on TimeoutException {
              if (!mounted) return;
              setState(() => _loading = false);
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(tr('AI javobi kechikdi. Qayta urinib ko‘ring.', 'AI отвечает слишком долго. Попробуйте снова.'))),
              );
            } catch (_) {
              if (!mounted) return;
              setState(() => _loading = false);
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(tr('Server bilan aloqa yo‘q.', 'Нет связи с сервером.'))),
              );
            }
          }

          Future<Map<String, dynamic>?> _chooseSimilar(Map<String, dynamic> data) async {
            final raw = data['suggestions'];
            final items = raw is List
                ? raw.whereType<Map>().map((e) => Map<String, dynamic>.from(e)).toList()
                : <Map<String, dynamic>>[];
            if (items.isEmpty) return null;

            final detected = data['detected'] is Map
                ? Map<String, dynamic>.from(data['detected'] as Map)
                : <String, dynamic>{};
            final amps = detected['amps'] is List ? (detected['amps'] as List).join(', ') : '';
            final info = <String>[
              if ((detected['brand'] ?? '').toString().isNotEmpty) (detected['brand'] ?? '').toString().toUpperCase(),
              if (amps.isNotEmpty) '${amps}A',
              if ((detected['curve'] ?? '').toString().isNotEmpty) (detected['curve'] ?? '').toString(),
              if ((detected['poles'] ?? '').toString().isNotEmpty) (detected['poles'] ?? '').toString(),
            ].join(' • ');

            return showModalBottomSheet<Map<String, dynamic>>(
              context: context,
              isDismissible: false,
              enableDrag: false,
              isScrollControlled: true,
              backgroundColor: surfaceColor(context),
              shape: const RoundedRectangleBorder(
                borderRadius: BorderRadius.vertical(top: Radius.circular(28)),
              ),
              builder: (sheetContext) => SafeArea(
                child: Container(
                  constraints: BoxConstraints(maxHeight: MediaQuery.of(sheetContext).size.height * .78),
                  padding: const EdgeInsets.fromLTRB(18, 20, 18, 12),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        tr('Aniq topilmadi — o‘xshash mahsulotni tanlang', 'Точного совпадения нет — выберите похожий товар'),
                        style: TextStyle(color: primaryText(sheetContext), fontSize: 20, fontWeight: FontWeight.w900),
                      ),
                      if (info.isNotEmpty) ...[
                        const SizedBox(height: 8),
                        Text('${tr('AI aniqladi', 'AI определил')}: $info', style: const TextStyle(color: AppColors.green, fontWeight: FontWeight.w700)),
                      ],
                      const SizedBox(height: 8),
                      Text(
                        tr('Narx faqat sizning omboringizdan olinadi.', 'Цена берётся только из вашего склада.'),
                        style: TextStyle(color: mutedText(sheetContext)),
                      ),
                      const SizedBox(height: 14),
                      Flexible(
                        child: ListView.separated(
                          shrinkWrap: true,
                          itemCount: items.length,
                          separatorBuilder: (_, __) => const SizedBox(height: 10),
                          itemBuilder: (_, i) {
                            final item = items[i];
                            final score = double.tryParse('${item['score'] ?? 0}') ?? 0;
                            return Material(
                              color: Colors.transparent,
                              child: ListTile(
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)),
                                tileColor: AppColors.cyan.withOpacity(.06),
                                leading: CircleAvatar(
                                  backgroundColor: AppColors.cyan.withOpacity(.12),
                                  child: Text('${i + 1}', style: const TextStyle(color: AppColors.cyan, fontWeight: FontWeight.w900)),
                                ),
                                title: Text((item['name'] ?? '—').toString(), style: TextStyle(color: primaryText(sheetContext), fontWeight: FontWeight.w800)),
                                subtitle: Text('${item['price'] ?? '0'} UZS • ${score.toStringAsFixed(0)}%', style: const TextStyle(color: AppColors.green, fontWeight: FontWeight.w700)),
                                trailing: const Icon(Icons.chevron_right_rounded, color: AppColors.cyan),
                                onTap: () => Navigator.pop(sheetContext, item),
                              ),
                            );
                          },
                        ),
                      ),
                      const SizedBox(height: 10),
                      SizedBox(
                        width: double.infinity,
                        child: TextButton.icon(
                          onPressed: () => Navigator.pop(sheetContext, {'_rescan': true}),
                          icon: const Icon(Icons.refresh_rounded),
                          label: Text(tr('Qayta skan qilish', 'Сканировать снова')),
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }'''
          s = s[:scan_start] + new_scan + s[scan_end:]
          p.write_text(s, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

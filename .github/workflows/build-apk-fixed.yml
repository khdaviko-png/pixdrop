name: Build PixDrop Fixed APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/pixdrop_src
          cp main.dart /tmp/pixdrop_src/main.dart
          cp pubspec.yaml /tmp/pixdrop_src/pubspec.yaml
          flutter create --platforms=android --org uz.pixdrop --project-name pixdrop .
          cp /tmp/pixdrop_src/main.dart lib/main.dart
          cp /tmp/pixdrop_src/pubspec.yaml pubspec.yaml
          mkdir -p assets
          cp -r "$GITHUB_WORKSPACE/assets/." assets/

      - name: Apply and verify requested UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          # Existing source compatibility.
          s = s.replace('minHeight: 118,', 'constraints: const BoxConstraints(minHeight: 118),')

          # Telegram support.
          if "package:url_launcher/url_launcher.dart" not in s:
              s = s.replace(
                  "import 'package:shared_preferences/shared_preferences.dart';",
                  "import 'package:shared_preferences/shared_preferences.dart';\nimport 'package:url_launcher/url_launcher.dart';"
              )

          # Persist theme and language, and restore them before the first frame.
          old_main = """Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const PixDropApp());
}"""
          new_main = """Future<void> main() async {
  WidgetsFlutterBinding.ensureInitialized();
  final prefs = await SharedPreferences.getInstance();
  isUzbek.value = prefs.getBool('ui_is_uzbek') ?? true;
  themeMode.value = (prefs.getBool('ui_dark_mode') ?? true)
      ? ThemeMode.dark
      : ThemeMode.light;
  runApp(const PixDropApp());
}"""
          if old_main in s:
              s = s.replace(old_main, new_main)

          old_theme_switch = """onChanged: (v) {
                      themeMode.value = v ? ThemeMode.dark : ThemeMode.light;
                      setState(() {});
                    },"""
          new_theme_switch = """onChanged: (v) async {
                      themeMode.value = v ? ThemeMode.dark : ThemeMode.light;
                      final prefs = await SharedPreferences.getInstance();
                      await prefs.setBool('ui_dark_mode', v);
                      if (mounted) setState(() {});
                    },"""
          s = s.replace(old_theme_switch, new_theme_switch)

          old_lang_switch = """onChanged: (v) {
                      isUzbek.value = v;
                      setState(() {});
                    },"""
          new_lang_switch = """onChanged: (v) async {
                      isUzbek.value = v;
                      final prefs = await SharedPreferences.getInstance();
                      await prefs.setBool('ui_is_uzbek', v);
                      if (mounted) setState(() {});
                    },"""
          s = s.replace(old_lang_switch, new_lang_switch)

          # PixDrop brand: Pix must be green instead of cyan/blue.
          s = s.replace(
              "TextSpan(text: 'Pix', style: TextStyle(color: AppColors.cyan)),",
              "TextSpan(text: 'Pix', style: TextStyle(color: AppColors.green)),"
          )

          # Theme-aware fixed dark backgrounds: these caused poor/hidden text in light mode.
          for old in [
              'color: const Color(0xFF071A24),',
              'color: const Color(0xFF06212A),',
              'color: const Color(0xFF06202A),',
              'color: const Color(0xFF081A25),',
              'fillColor: const Color(0xFF071A24),',
              'fillColor: const Color(0xFF06212A),',
              'fillColor: const Color(0xFF081A25),',
          ]:
              replacement = 'fillColor: surfaceColor(context),' if old.startswith('fillColor') else 'color: surfaceColor(context),'
              s = s.replace(old, replacement)

          # Make generic dialog/menu text theme-aware via Material theme.
          s = s.replace(
              """return base.copyWith(
      scaffoldBackgroundColor: AppColors.lightBg,""",
              """return base.copyWith(
      scaffoldBackgroundColor: AppColors.lightBg,
      textTheme: base.textTheme.apply(bodyColor: AppColors.lightText, displayColor: AppColors.lightText),
      iconTheme: const IconThemeData(color: AppColors.lightText),
      dialogTheme: const DialogThemeData(backgroundColor: Colors.white),
      bottomSheetTheme: const BottomSheetThemeData(backgroundColor: Colors.white),"""
          )
          s = s.replace(
              """return base.copyWith(
      scaffoldBackgroundColor: AppColors.bg,""",
              """return base.copyWith(
      scaffoldBackgroundColor: AppColors.bg,
      textTheme: base.textTheme.apply(bodyColor: AppColors.text, displayColor: AppColors.text),
      iconTheme: const IconThemeData(color: AppColors.text),
      dialogTheme: const DialogThemeData(backgroundColor: AppColors.surface),
      bottomSheetTheme: const BottomSheetThemeData(backgroundColor: AppColors.surface),"""
          )

          # Exact Telegram username -> open external Telegram app/browser.
          old_tg = """const Text(
                          '@Parvizgaybullayev',
                          style: TextStyle(
                            color: AppColors.cyan,
                            fontWeight: FontWeight.w900,
                          ),
                        ),"""
          new_tg = """InkWell(
                          borderRadius: BorderRadius.circular(10),
                          onTap: () async {
                            final uri = Uri.parse('https://t.me/Parvizgaybullayev');
                            final opened = await launchUrl(uri, mode: LaunchMode.externalApplication);
                            if (!opened && context.mounted) {
                              ScaffoldMessenger.of(context).showSnackBar(
                                SnackBar(content: Text(tr('Telegram ochilmadi', 'Не удалось открыть Telegram'))),
                              );
                            }
                          },
                          child: const Padding(
                            padding: EdgeInsets.symmetric(vertical: 6),
                            child: Text(
                              '@Parvizgaybullayev',
                              style: TextStyle(
                                color: AppColors.green,
                                fontWeight: FontWeight.w900,
                                decoration: TextDecoration.underline,
                              ),
                            ),
                          ),
                        ),"""
          if old_tg in s:
              s = s.replace(old_tg, new_tg)

          p.write_text(s, encoding='utf-8')

          # Android launcher label shown below the icon.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />'
              )
          m = m.replace('android:label="pixdrop"', 'android:label="PixDrop"')
          manifest.write_text(m, encoding='utf-8')

          # Build must fail if any requested fix was not actually applied.
          checks = {
              'green Pix': "TextSpan(text: 'Pix', style: TextStyle(color: AppColors.green))" in s,
              'Telegram package': "package:url_launcher/url_launcher.dart" in s,
              'Telegram link': "https://t.me/Parvizgaybullayev" in s,
              'Telegram username': "@Parvizgaybullayev" in s,
              'saved Uzbek/Russian': "prefs.setBool('ui_is_uzbek', v)" in s,
              'saved dark/light': "prefs.setBool('ui_dark_mode', v)" in s,
              'theme restored at startup': "prefs.getBool('ui_dark_mode')" in s and "prefs.getBool('ui_is_uzbek')" in s,
              'PixDrop Android label': 'android:label="PixDrop"' in m,
          }
          missing = [name for name, ok in checks.items() if not ok]
          print('UI FIX VERIFICATION:', checks)
          if missing:
              raise SystemExit('Requested fixes missing: ' + ', '.join(missing))
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze patched app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: pixdrop-fixed-ui-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
